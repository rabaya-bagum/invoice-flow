# Local backend: API + plain Postgres with our migrations applied.
# For the full Supabase experience (Auth, Storage, Studio) use `supabase start` instead.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoiceflow
    ports: ['54322:5432']
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./supabase:/supabase:ro
      - ./docker/db-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d invoiceflow']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: ./api/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/invoiceflow
    ports: ['4000:4000']
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
